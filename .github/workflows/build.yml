name: Build DREX PC CLEANER
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed for creating releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for version detection

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Find project file
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Filter DrexPcCleaner.csproj | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          if (-not $p) {
            Get-ChildItem -Recurse -File | ForEach-Object { $_.FullName }
            Write-Error "DrexPcCleaner.csproj not found"
            exit 1
          }
          Write-Host "Building: $($p.FullName)"
          "PROJ=$($p.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Get version from tag or generate
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)$') {
            $version = $matches[1]
          } else {
            # Generate version from date for non-tag builds
            $version = (Get-Date -Format "yyyy.MM.dd-HHmm")
          }
          Write-Host "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish framework-dependent (smaller, needs .NET 10 runtime)
        shell: pwsh
        run: dotnet publish "$env:PROJ" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/framework-dependent

      - name: Publish self-contained (no runtime needed, larger)
        shell: pwsh
        run: dotnet publish "$env:PROJ" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/self-contained

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DREX_PC_CLEANER_${{ env.VERSION }}
          path: |
            out/framework-dependent/DREX_PC_CLEANER.exe
            out/self-contained/DREX_PC_CLEANER.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DREX PC Cleaner ${{ env.VERSION }}
          body: |
            ## DREX PC Cleaner ${{ env.VERSION }}

            **Downloads:**
            - **Framework-dependent** (~15 MB): Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
            - **Self-contained** (~85 MB): No runtime needed, runs anywhere

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/framework-dependent/DREX_PC_CLEANER.exe
            out/self-contained/DREX_PC_CLEANER.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ env.VERSION }}
          name: DREX PC Cleaner (Nightly) ${{ env.VERSION }}
          body: |
            ## Nightly Build ${{ env.VERSION }}

            ⚠️ **This is an automated nightly build** - may contain experimental changes.

            **Downloads:**
            - **Framework-dependent** (~15 MB): Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
            - **Self-contained** (~85 MB): No runtime needed, runs anywhere

            These builds are automatically replaced on each push to main.
          draft: false
          prerelease: true
          make_latest: false
          files: |
            out/framework-dependent/DREX_PC_CLEANER.exe
            out/self-contained/DREX_PC_CLEANER.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
