name: Build DREX PC CLEANER
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Find project file
        shell: pwsh
        run: |
          $p = Get-ChildItem -Recurse -Filter DrexPcCleaner.csproj | Select-Object -First 1
          if (-not $p) {
            Get-ChildItem -Recurse -File | ForEach-Object { $_.FullName }
            Write-Error "DrexPcCleaner.csproj not found"
            exit 1
          }
          Write-Host "Found: $($p.FullName)"
          "PROJ=$($p.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish self-contained (no runtime needed)
        shell: pwsh
        run: dotnet publish "$env:PROJ" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/self-contained

      - name: Publish framework-dependent (small)
        shell: pwsh
        run: dotnet publish "$env:PROJ" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/small

      - uses: actions/upload-artifact@v4
        with:
          name: DREX_PC_CLEANER
          path: out/**/DREX_PC_CLEANER.exe
